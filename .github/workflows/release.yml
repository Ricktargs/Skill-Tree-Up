# =========================================================
# LANÇAR VERSÃO NOVA DO ORBE-G
# Ao enviar uma tag "v1.2.3" para o GitHub, este robô:
#   1. gera o instalador do Windows (.exe + latest.yml do atualizador)
#   2. gera o app do Mac (.dmg, Intel e Apple Silicon)
#   3. gera o app do Android (.apk)
#   4. publica tudo num Release — o botão "Atualizar" do programa
#      e os links de download pegam sempre o mais novo.
# Como usar (no PowerShell, dentro da pasta do projeto):
#   git tag v1.0.1
#   git push origin v1.0.1
# =========================================================
name: Lançar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx vite build
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/ORBE-G-Instalador.exe
            release/ORBE-G-Instalador.exe.blockmap
            release/latest.yml

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx vite build
      - run: npx electron-builder --mac dmg --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/ORBE-G-Mac.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Versão da tag
        id: ver
        run: |
          V="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then V="$(node -p "require('./package.json').version")"; fi
          npm version "$V" --no-git-tag-version --allow-same-version
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - run: npx vite build
      - run: npx cap sync android
      - name: Gerar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PorbeVersionCode=${{ github.run_number }} -PorbeVersionName=${{ steps.ver.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk ../ORBE-G-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ORBE-G-Android.apk

  publicar:
    needs: [windows, mac, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: arquivos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ORBE-G ${{ github.ref_name }}
          make_latest: true
          body: |
            **Baixar:**
            - 🪟 Windows: `ORBE-G-Instalador.exe`
            - 🍎 Mac: `ORBE-G-Mac.dmg` (na primeira vez: botão direito no app → Abrir)
            - 🤖 Android: `ORBE-G-Android.apk` (permita "instalar apps desconhecidos")
          files: arquivos/*
